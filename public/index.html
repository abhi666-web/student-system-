<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Student Management System</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1d2433;--mu:#6b7385;--ac:#3b5bdb;--bd:#e1e4ec;--ok:#2f9e44;--bad:#e03131;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b2030;--tx:#e8eaf0;--mu:#98a1b5;--ac:#7c93ff;--bd:#2c3348;--ok:#51cf66;--bad:#ff6b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b2030;--tx:#e8eaf0;--mu:#98a1b5;--ac:#7c93ff;--bd:#2c3348;--ok:#51cf66;--bad:#ff6b6b;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
h1{font-size:17px;margin:0}main{max-width:900px;margin:0 auto;padding:16px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}
button,select,input{font:inherit;color:var(--tx)}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.on{background:var(--ac);color:#fff}button.d{background:var(--bad)}
input,select{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;width:100%}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}.stat b{display:block;font-size:26px}.stat span,.mu{color:var(--mu);font-size:13px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:600;font-size:13px}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;min-width:80px}.bar i{display:block;height:100%;background:var(--ok)}
.login{max-width:360px;margin:12vh auto}.err{color:var(--bad);font-size:13px}td input{width:80px;padding:5px 8px}
</style></head><body>
<div id="app"><main><p class="mu">Loading…</p></main></div>
<script>
const $=s=>document.querySelector(s),V=id=>($('#'+id)||{}).value||'';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
const grade=p=>p>=90?'A+':p>=80?'A':p>=70?'B':p>=60?'C':p>=50?'D':'F';
let db=null,isT=false,role=null,me=null,tab='dash',msg='',D={students:[],subjects:[],attendance:[],marks:[],teachers:[]},ui={sub:'',date:today(),edit:null,draft:null,sedit:null};

const api=async(m,u,b)=>{const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j};
const col=n=>({doc:id=>({set:async o=>{await api('PUT','/api/'+n+'/'+id,o);await refresh()},delete:async()=>{await api('DELETE','/api/'+n+'/'+id);await refresh()}})});
async function refresh(){const j=await api('GET','/api/data');D=j.data;role=j.role;me=j.me||null;isT=!!j.admin;render()}
const sub=id=>D.subjects.find(x=>x.id===id),stu=id=>D.students.find(x=>x.id===id);
const attStats=(sid,subId)=>{let p=0,t=0;D.attendance.forEach(r=>{if(r.sub===subId&&sid in(r.m||{})){t++;if(r.m[sid])p++}});return{p,t,pc:t?Math.round(p*100/t):0}};
const subPct=(sid,subId)=>{const m=D.marks.find(x=>x.sub===subId&&x.stu===sid);return m?Math.round(m.score*100/m.max):null};
const bar=p=>`<div class="bar"><i style="width:${p}%"></i></div>`;

async function init(){try{await refresh()}catch(e){render()}setInterval(()=>{if(role&&!document.hidden&&!document.activeElement.matches('input,select'))refresh().catch(()=>{})},8000)}
function render(){
  const a=$('#app');
  if(!role){a.innerHTML=`<div class="login card"><h1>Student Management System</h1><p class="mu">Sign in to continue</p>
  <input id="lu" placeholder="Username" autocapitalize="none"><div style="height:8px"></div><input id="lp" type="password" placeholder="Password"><div style="height:10px"></div>
  <button data-a="slogin" style="width:100%">Student login</button><div style="height:8px"></div><button data-a="tlogin" style="width:100%">Teacher login</button><p class="err">${esc(msg)}</p>${location.hash==='#admin'?'<hr style="border:0;border-top:1px solid var(--bd)"><button class="g" data-a="alogin" style="width:100%">Owner / admin sign-in</button><p class="mu">Admin sign-in is only for the site owner.</p>':''}</div>`;return}
  const T=role==='t',tabs=T?[['dash','Dashboard'],['stu','Students']].concat(me==='admin'?[['subj','Subjects']]:[],[['att','Attendance'],['res','Results'],['exp','Export']],me==='admin'&&isT?[['tch','Teachers']]:[]):[['dash','Dashboard'],['att','Attendance'],['res','Results']];
  const s=T?null:stu(me);
  a.innerHTML=`<header><h1>🎓 ${T?'Teacher':esc(s?s.name:'Student')}</h1><button class="g" data-a="out">Log out</button></header><main>
  <nav>${tabs.map(([k,l])=>`<button class="${tab===k?'on':'g'}" data-a="tab" data-k="${k}">${l}</button>`).join('')}</nav>
  ${msg?`<p class="err">${esc(msg)}</p>`:''}${({dash:dash,stu:stuP,subj:subjP,att:attP,res:resP,tch:tchP,exp:expP})[tab]()}</main>`;
}
function dash(){
  if(role==='t'){
    let tp=0,tt=0;D.attendance.forEach(r=>Object.values(r.m||{}).forEach(v=>{tt++;if(v)tp++}));
    const sc=D.marks.map(m=>m.score*100/m.max),avg=sc.length?Math.round(sc.reduce((x,y)=>x+y,0)/sc.length):0;
    return `<div class="grid"><div class="stat"><b>${D.students.length}</b><span>Students</span></div><div class="stat"><b>${D.subjects.length}</b><span>Subjects</span></div>
    <div class="stat"><b>${tt?Math.round(tp*100/tt):0}%</b><span>Avg attendance</span></div><div class="stat"><b>${avg}%</b><span>Avg score (${grade(avg)})</span></div></div>
    <div class="card" style="margin-top:14px"><b>By subject</b><div class="wrap"><table><tr><th>Subject</th><th>Attendance</th><th>Avg score</th></tr>${mySubs().map(x=>{let p=0,t=0;D.attendance.filter(r=>r.sub===x.id).forEach(r=>Object.values(r.m||{}).forEach(v=>{t++;if(v)p++}));const ms=D.marks.filter(m=>m.sub===x.id).map(m=>m.score*100/m.max),av=ms.length?Math.round(ms.reduce((a,b)=>a+b,0)/ms.length):0;return `<tr><td>${esc(x.name)}</td><td>${t?Math.round(p*100/t):0}%</td><td>${av}%</td></tr>`}).join('')||'<tr><td class="mu">Add subjects first</td></tr>'}</table></div></div>`;
  }
  const s=stu(me);if(!s)return '<p class="mu">Loading…</p>';
  let p=0,t=0,sc=[];D.subjects.forEach(x=>{const a=attStats(s.id,x.id);p+=a.p;t+=a.t;const r=subPct(s.id,x.id);if(r!==null)sc.push(r)});
  const avg=sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length):0;
  return `<div class="grid"><div class="stat"><b>${t?Math.round(p*100/t):0}%</b><span>Overall attendance</span></div><div class="stat"><b>${avg}%</b><span>Average score</span></div><div class="stat"><b>${sc.length?grade(avg):'–'}</b><span>Overall grade</span></div></div>
  <p class="mu">Roll ${esc(s.roll)} · Class ${esc(s.cls)}</p>`;
}
function stuP(){
  const e=ui.edit?stu(ui.edit):null;
  return `<div class="card"><b>${e?'Edit student':'Add student'}</b><div class="row" style="margin-top:8px">
  <input id="fn" placeholder="Full name" value="${esc(e?.name)}"><input id="fr" placeholder="Roll no." value="${esc(e?.roll)}"><input id="fc" placeholder="Class" value="${esc(e?.cls)}">
  <input id="fu" placeholder="Username" autocapitalize="none" value="${esc(e?.user)}"><input id="fp" placeholder="${e?'New password (blank = keep)':'Password'}"></div>
  <button data-a="sstu">${e?'Update':'Add'}</button> ${e?'<button class="g" data-a="cancel">Cancel</button>':''}</div>
  <div class="card wrap"><table><tr><th>Roll</th><th>Name</th><th>Class</th><th>Username</th><th></th></tr>${D.students.sort((a,b)=>String(a.roll).localeCompare(b.roll,0,{numeric:true})).map(s=>`<tr><td>${esc(s.roll)}</td><td>${esc(s.name)}</td><td>${esc(s.cls)}</td><td>${esc(s.user)}</td><td><button class="g" data-a="estu" data-id="${s.id}">Edit</button> <button class="d" data-a="dstu" data-id="${s.id}">Delete</button></td></tr>`).join('')||'<tr><td class="mu">No students yet</td></tr>'}</table></div>`;
}
function subjP(){
  const e=ui.sedit?sub(ui.sedit):null;
  return `<div class="card"><b>${e?'Rename subject':'Add subject'}</b><div class="row" style="margin-top:8px"><input id="sn" placeholder="Subject name" value="${esc(e?.name)}"></div><button data-a="ssub">${e?'Update':'Add'}</button> ${e?'<button class="g" data-a="cancel">Cancel</button>':''}</div>
  <div class="card wrap"><table>${D.subjects.map(x=>`<tr><td>${esc(x.name)}</td><td><button class="g" data-a="esub" data-id="${x.id}">Edit</button> <button class="d" data-a="dsub" data-id="${x.id}">Delete</button></td></tr>`).join('')||'<tr><td class="mu">No subjects yet</td></tr>'}</table></div>`;
}
function tchP(){
  const e=ui.tedit?D.teachers.find(x=>x.id===ui.tedit):null;
  return `<div class="card"><b>${e?'Edit teacher':'Add teacher'}</b><div class="row" style="margin-top:8px"><input id="tn" placeholder="Full name" value="${esc(e?.name)}"><input id="tu" placeholder="Username" autocapitalize="none" value="${esc(e?.user)}"><input id="tp" placeholder="${e?'New password (blank = keep)':'Password'}"></div><div class="mu" style="margin-bottom:6px">Subjects taught</div><div style="display:flex;flex-wrap:wrap;gap:12px;margin-bottom:10px">${D.subjects.map(x=>`<label><input type="checkbox" class="ts" style="width:auto" value="${x.id}" ${(e?.subs||[]).includes(x.id)?'checked':''}> ${esc(x.name)}</label>`).join('')||'<span class="mu">Add subjects first</span>'}</div><button data-a="stch">${e?'Update':'Add'}</button> ${e?'<button class="g" data-a="cancel">Cancel</button>':''}</div>
  <div class="card wrap"><table><tr><th>Name</th><th>Username</th><th>Subjects</th><th></th></tr>${D.teachers.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.user)}</td><td>${esc((t.subs||[]).map(i=>sub(i)?.name).filter(Boolean).join(', ')||'–')}</td><td><button class="g" data-a="etch" data-id="${t.id}">Edit</button> <button class="d" data-a="dtch" data-id="${t.id}">Delete</button></td></tr>`).join('')||'<tr><td class="mu">No teachers yet</td></tr>'}</table></div>`;
}
const csv=r=>'\ufeff'+r.map(x=>x.map(v=>{v=v??'';if(typeof v==='string'&&/^[=+@-]/.test(v))v="'"+v;v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n');
function expP(){return `<div class="card"><b>Export data (CSV)</b><p class="mu">Opens in Excel or Google Sheets. ${me==='admin'&&isT?'Includes all subjects.':'Includes only your subjects.'}</p><div class="row"><div><span class="mu">From</span><input type="date" id="xf"></div><div><span class="mu">To</span><input type="date" id="xt"></div></div><p class="mu">The date range applies to attendance only.</p><div style="display:flex;flex-wrap:wrap;gap:8px"><button data-a="exp" data-k="stu">Student list</button><button data-a="exp" data-k="att">Attendance</button><button data-a="exp" data-k="res">Results</button><button data-a="exp" data-k="rc">Report cards</button></div></div>`}
async function doExport(k){
  const S=D.students.slice().sort((a,b)=>String(a.roll).localeCompare(b.roll,undefined,{numeric:true})),MS=mySubs(),ids=new Set(MS.map(x=>x.id));let rows,name=k;
  if(k==='stu'){rows=[['Roll','Name','Class','Username'],...S.map(s=>[s.roll,s.name,s.cls,s.user])];name='students'}
  else if(k==='att'){const f=V('xf'),t=V('xt');rows=[['Date','Subject','Roll','Name','Status']];name=
